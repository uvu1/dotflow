name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar czf dotflow-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release dotflow
      - name: Archive Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive target/${{ matrix.target }}/release/dotflow.exe dotflow-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: dotflow-${{ matrix.target }}
          path: dotflow-${{ github.ref_name }}-${{ matrix.target }}.*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum dotflow-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/dotflow-*'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --repo "${{ github.repository }}"
