[package]
name = "dotflow"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A safe, cross-platform orchestrator for Git-backed mise dotfiles"
repository = "https://github.com/uvu1/dotflow"
readme = "README.md"
keywords = ["dotfiles", "mise", "cli"]
categories = ["command-line-utilities", "config"]

[lib]
name = "dotflow"
path = "src/lib.rs"

[[bin]]
name = "dotflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6"
semver = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
